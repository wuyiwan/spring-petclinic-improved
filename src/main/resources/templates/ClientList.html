<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout}">

<head>
  <title>Clients - Petclinic</title>
</head>

<body>

<section layout:fragment="page-content">
<div class="container">
    <div class="mb-4">
        <h1><i class="bi bi-people-fill"></i> Clients</h1>
    </div>

    <div class="card p-4 mb-4">
        <div class="row align-items-center">
            <div class="col-md-8">
                <form class="row gy-2 gx-3 align-items-center">
                    <div class="col-auto">
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius: 12px 0 0 12px; background: #e3f2fd; border: 2px solid #e0e0e0; border-right: none;">
                                <i class="bi bi-search" style="color: #1976d2;"></i>
                            </span>
                            <input type="text" name="name" class="form-control" 
                                th:value="${name}"
                                id="autoSizingInput" placeholder="Search by name..."
                                style="border-radius: 0 12px 12px 0; border-left: none;">
                        </div>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i>
                            Search
                        </button>
                    </div>
                </form>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <a class="btn btn-primary" href="/clients/add">
                    <i class="bi bi-plus-circle"></i> Add New Client
                </a>
            </div>
        </div>
    </div>

    <div class="card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-bordered table-striped mb-0">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-person-badge"></i> First Name</th>
                    <th><i class="bi bi-person-badge-fill"></i> Last Name</th>
                    <th><i class="bi bi-envelope"></i> E-mail</th>
                    <th><i class="bi bi-calendar"></i> Date of Birth</th>
                    <th><i class="bi bi-gear"></i> Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td style="font-weight: 600; color: #1976d2;">[[${client.Id}]]</td>
                    <td th:text="${client.FirstName}"></td>
                    <td th:text="${client.LastName}"></td>
                    <td>[[${client.Email}]]</td>
                    <td th:text="${#temporals.format(client.BirthDate, 'MM/dd/yyyy')}"></td>
                    <td>
                        <form th:action="@{/clients/delete/{Id}(Id=${client.Id})}" method="post" class="d-inline">
                        <a class="btn btn-success btn-sm me-1" th:href="@{/clients/{Id}(Id=${client.Id})}">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>
                        <button class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this client?');">
                            <i class="bi bi-trash3"></i> Delete
                        </button>
                        </form>
                    </td>
                </tr>
                <tr th:unless="${not #lists.isEmpty(clients)}">
                    <td colspan="6" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3rem; color: #90a4ae;"></i>
                        <p class="text-muted mt-3 mb-0">No clients found</p>
                    </td>
                </tr>
            </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
    <nav>
        <ul class="pagination">
            <li th:each="page : ${pages}" class="page-item" th:classappend="${page.htmlClass}">
                <a th:href="${page.url}" class="page-link">
                    [[${page.displayName}]]
                </a>
            </li>
        </ul>
    </nav>
    </div>

</div>

</section>

</body>

<th:block layout:fragment="page-scripts">
<script>
</script>
</th:block>

</html>
