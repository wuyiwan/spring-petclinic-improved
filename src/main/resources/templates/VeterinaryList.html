<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout}">

<head>
  <title>Veterinaries - Petclinic</title>
</head>

<body>

<section layout:fragment="page-content">
<div class="container">
    <div class="mb-4">
        <h1><i class="bi bi-person-circle"></i> Veterinarians</h1>
    </div>

    <div class="row justify-content-end mb-4">
        <div class="col-md-4 text-md-end">
            <a class="btn btn-primary" href="/veterinary/add">
                <i class="bi bi-plus-circle"></i> Add Veterinarian
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="vet : ${vets}">
            <div class="card h-100 p-4 text-center">
                <div class="mb-3">
                    <i class="bi bi-person-circle" style="font-size: 4rem; color: #1976d2;"></i>
                </div>
                <h5 class="card-title" style="color: #1976d2; font-weight: 600;">
                    Dr [[${vet.FirstName}]] [[${vet.LastName}]]
                </h5>
                <p class="text-muted small">ID: [[${vet.Id}]]</p>
                <div class="mt-auto">
                    <a class="btn btn-success btn-sm me-1" th:href="@{/veterinary/edit/{Id}(Id=${vet.Id})}">
                        <i class="bi bi-pencil-square"></i> Edit
                    </a>
                    <a class="btn btn-danger btn-sm" th:href="@{/veterinary/delete/{Id}(Id=${vet.Id})}" 
                       onclick="return confirm('Are you sure you want to delete this veterinarian?');">
                        <i class="bi bi-trash3"></i> Delete
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

</section>

</body>

<th:block layout:fragment="page-scripts">
<script>
</script>
</th:block>

</html>
