<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout}">

<head>
  <title>Veterinary - Petclinic</title>
</head>

<body>

<section layout:fragment="page-content">
<div class="container">
    <div class="mb-4">
        <h1><i class="bi bi-pencil-square"></i> Edit Veterinarian</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-5">
                <form method="post" th:action="@{/veterinary/edit/{Id}(Id=${Id})}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">
                                <i class="bi bi-person" style="color: #3f51b5;"></i> First Name
                            </label>
                            <input type="text" class="form-control" id="firstName" name="FirstName" th:value="${vet.FirstName}"
                                placeholder="Enter first name">
                        </div>
                        <div class="col-md-6">
                            <label for="lastname" class="form-label">
                                <i class="bi bi-person-fill" style="color: #3f51b5;"></i> Last Name
                            </label>
                            <input type="text" class="form-control" id="lastname" name="LastName" th:value="${vet.LastName}"
                                placeholder="Enter last name">
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-check-circle"></i> Update Veterinarian
                                </button>
                                <a href="/veterinaries" class="btn btn-outline-secondary px-5" style="border-radius: 25px;">
                                    <i class="bi bi-arrow-left"></i> Cancel
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

</section>

</body>

<th:block layout:fragment="page-scripts">
<script>
</script>
</th:block>

</html>
