<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">

<head>
	<title>Daily schedule - Petclinic</title>
</head>

<body>

	<section layout:fragment="page-content">
		<div class="container">
			<div class="mb-4">
				<h1><i class="bi bi-calendar3"></i> Schedule</h1>
			</div>

			<div class="card p-4 mb-4">
				<ul class="nav nav-tabs mb-0">
					<li class="nav-item">
						<a class="nav-link" href="/schedule" th:classappend="0 == ${Id} ? 'active' : ''">
							<i class="bi bi-calendar-range"></i> Daily schedule
						</a>
					</li>
					<li th:each="vet : ${vets}" th:class="'nav-item'">
						<a class="nav-link" th:href="@{/schedule/{Id}(Id=${vet.Id})}"
							th:classappend="${vet.Id} == ${Id} ? 'active' : ''">
							<i class="bi bi-person-circle"></i> Dr [[${vet.FirstName}]] [[${vet.LastName}]]
						</a>
					</li>
				</ul>
			</div>

			<div class="card p-4 mb-4">
				<form action="/schedule" method="get">
					<div class="row align-items-center">
						<div class="col-md-4">
							<div class="input-group">
								<span class="input-group-text" style="border-radius: 12px 0 0 12px; background: #e3f2fd; border: 2px solid #e0e0e0; border-right: none;">
									<i class="bi bi-calendar" style="color: #1976d2;"></i>
								</span>
								<input type="text" class="form-control datepicker" id="inputLastName"
									th:value="*{#temporals.format(Day, 'MM/dd/yyyy')}" name="Day" autocomplete="off"
									style="border-radius: 0 12px 12px 0; border-left: none;" placeholder="Select date">
							</div>
						</div>
						<div class="col-md-4 mt-3 mt-md-0">
							<button type="submit" class="btn btn-primary">
								<i class="bi bi-search"></i>
								Search Schedule
							</button>
						</div>
					</div>
				</form>
			</div>

			<div class="card p-0 overflow-hidden">
				<div class="table-responsive">
					<table class="table table-bordered table-striped mb-0">
						<thead>
							<tr>
								<th><i class="bi bi-clock"></i> Hour</th>
								<th th:each="vet : ${vets}" th:text="|Dr ${vet.FirstName} ${vet.LastName}|"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="s : ${schedule}">
								<td style="font-weight: 600; color: #1976d2; background: rgba(227, 242, 253, 0.8);">[[${s.Key}]]</td>
								<td th:each="a : ${s.Value}" th:classappend="${#strings.contains(a, 'Appointment')} ? 'bg-light' : ''">
									<span th:if="${#strings.contains(a, 'Available')}" style="color: #2e7d32; font-weight: 500;">
										<i class="bi bi-check-circle"></i> [[${a}]]
									</span>
									<span th:if="${#strings.contains(a, 'Appointment')}" style="color: #c62828; font-weight: 500;">
										<i class="bi bi-x-circle"></i> [[${a}]]
									</span>
									<span th:if="${not #strings.contains(a, 'Available') and not #strings.contains(a, 'Appointment')}">[[${a}]]</span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>

	</section>

</body>

<th:block layout:fragment="page-scripts">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"
		integrity="sha512-T/tUfKSV1bihCnd+MxKD0Hm1uBBroVYBOYSk1knyvQ9VyZJpc/ALb4P0r6ubwVPSGB2GvjeoMAJJImBG12TiaQ=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"
		integrity="sha512-mSYUmp1HYZDFaVKK//63EcZq4iFWFjxSL+Z3T/aCt4IO9Cejm03q3NKKYN6pFQzY0SBOr8h+eCIAZHPXcpZaNw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<script>
		$('.datepicker').datepicker();
	</script>
</th:block>


</html>
