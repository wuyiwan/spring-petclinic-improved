<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Pets - Petclinic</title>
</head>

<body>

    <section layout:fragment="page-content">
        <div class="container">
            <div class="mb-4">
                <h1><i class="bi bi-paw-fill"></i> Pets</h1>
            </div>

            <div class="card p-4 mb-4">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <form class="row gy-2 gx-3 align-items-center">
                            <div class="col-auto">
                                <div class="input-group">
                                    <span class="input-group-text" style="border-radius: 12px 0 0 12px; background: #e3f2fd; border: 2px solid #e0e0e0; border-right: none;">
                                        <i class="bi bi-search" style="color: #1976d2;"></i>
                                    </span>
                                    <input type="text" name="name" class="form-control" th:value="${name}" id="autoSizingInput"
                                        placeholder="Search by name..." style="border-radius: 0 12px 12px 0; border-left: none;">
                                </div>
                            </div>
                            <div class="col-auto">
                                <select name="pt" id="" class="form-select">
                                    <option value="0">All types</option>
                                    <option th:each="p : ${petTypes}" th:text="${p.Name}" th:selected="${p.Id==pt}"
                                        th:value="${p.Id}"></option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search"></i>
                                    Search
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <a class="btn btn-primary" href="pets/add">
                            <i class="bi bi-plus-circle"></i>
                            Add New Pet
                        </a>
                    </div>
                </div>
            </div>

            <div class="card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped mb-0">
                        <thead>
                            <tr>
                                <th><i class="bi bi-hash"></i> ID</th>
                                <th><i class="bi bi-paw"></i> Name</th>
                                <th><i class="bi bi-tag"></i> Type</th>
                                <th><i class="bi bi-person"></i> Owner</th>
                                <th><i class="bi bi-gear"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pets}">
                                <td style="font-weight: 600; color: #9c27b0;">[[${p.Id}]]</td>
                                <td th:text="${p.Name}"></td>
                                <td>
                                    <span class="badge" style="background: linear-gradient(90deg, #9c27b0, #e91e63); padding: 8px 16px; border-radius: 20px;">
                                        [[${p.PetType}]]
                                    </span>
                                </td>
                                <td th:text="${p.Owner}"></td>
                                <td>
                                    <form th:action="@{/pets/delete/{Id}(Id=${p.Id})}" method="post" class="d-inline">
                                        <a class="btn btn-success btn-sm me-1" th:href="@{/pets/{Id}(Id=${p.Id})}">
                                            <i class="bi bi-pencil-square"></i> Edit
                                        </a>
                                        <button class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this pet?');">
                                            <i class="bi bi-trash3"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:unless="${not #lists.isEmpty(pets)}">
                                <td colspan="5" class="text-center py-5">
                                    <i class="bi bi-box2" style="font-size: 3rem; color: #90a4ae;"></i>
                                    <p class="text-muted mt-3 mb-0">No pets found</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-center mt-4">
                <nav>
                    <ul class="pagination">
                        <li th:each="page : ${pages}" class="page-item" th:classappend="${page.htmlClass}">
                            <a th:href="${page.url}" class="page-link">
                                [[${page.displayName}]]
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </section>
</body>
